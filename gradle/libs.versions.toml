[versions]
agp = "9.4.1"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
activityKtx = "1.9.1"
constraintlayout = "2.1.4"
lifecycleRuntimeKtx = "2.8.4"
camerax = "1.3.4"
coroutines = "1.8.1"
workRuntimeKtx = "2.9.1"
